<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Iqbal Hilmy Izzulhaq — AI systems builder</title>
  <desc id="desc">A dark cyan and violet evidence trace connecting retrieval, tools, source data, and evaluation around an auditable AI system.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.52" stop-color="#071426"/>
      <stop offset="1" stop-color="#11102B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#67E8F9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="20" y="20" width="1160" height="380" rx="24"/>
    </clipPath>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill: #8CA3BE; }
      .signal { animation: signal 6s linear infinite; }
      .orbit-a { transform-origin: 935px 210px; animation: spin 40s linear infinite; }
      .orbit-b { transform-origin: 935px 210px; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .cursor { animation: blink 1.2s steps(2, end) infinite; }
      @keyframes signal { to { stroke-dashoffset: -80; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .signal, .orbit-a, .orbit-b, .pulse, .cursor { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect x="20" y="20" width="1160" height="380" rx="24" fill="url(#background)"/>
    <rect x="20" y="20" width="1160" height="380" fill="url(#grid)"/>
    <circle cx="120" cy="62" r="230" fill="url(#cyanGlow)"/>
    <circle cx="1050" cy="360" r="290" fill="url(#violetGlow)"/>
    <g fill="#CFFAFE" opacity="0.65">
      <circle cx="94" cy="105" r="1.2"/><circle cx="183" cy="44" r="1"/><circle cx="314" cy="92" r="1.1"/>
      <circle cx="522" cy="58" r="1"/><circle cx="654" cy="116" r="1.2"/><circle cx="734" cy="52" r="1"/>
      <circle cx="1124" cy="90" r="1.2"/><circle cx="1074" cy="282" r="1"/><circle cx="752" cy="350" r="1.2"/>
      <circle cx="426" cy="373" r="1"/><circle cx="244" cy="346" r="1.1"/><circle cx="1142" cy="372" r="1"/>
    </g>

    <path d="M700 48V372" stroke="#93C5FD" stroke-opacity="0.13"/>

    <g class="mono">
      <rect x="72" y="48" width="252" height="26" rx="13" fill="#0B2238" stroke="#22D3EE" stroke-opacity="0.42"/>
      <circle class="pulse" cx="88" cy="61" r="4" fill="#34D399" filter="url(#softGlow)"/>
      <text x="101" y="65" fill="#A5F3FC" font-size="11" letter-spacing="1.35">SHIVERION // EVIDENCE SYSTEMS</text>

      <text x="72" y="135" class="sans" fill="#F8FAFC" font-size="46" font-weight="750" letter-spacing="-1.2">MUHAMMAD IQBAL</text>
      <text x="72" y="185" class="sans" fill="url(#edge)" font-size="46" font-weight="750" letter-spacing="-1.2">HILMY IZZULHAQ</text>

      <text x="74" y="222" fill="#BAE6FD" font-size="15" letter-spacing="2.2">AI AGENT ENGINEER  ×  DATA SCIENTIST</text>
      <text x="74" y="259" class="sans" fill="#CBD5E1" font-size="16">Building systems that retrieve evidence, reason with constraints,</text>
      <text x="74" y="283" class="sans" fill="#CBD5E1" font-size="16">and survive contact with real users.<tspan class="cursor" fill="#67E8F9">▋</tspan></text>

      <g font-size="12" text-anchor="middle" letter-spacing="0.8">
        <g><rect x="72" y="318" width="100" height="34" rx="8" fill="#071C2D" stroke="#22D3EE" stroke-opacity="0.36"/><text x="122" y="339" fill="#A5F3FC">OBSERVE</text></g>
        <path d="M176 335H186" stroke="#38BDF8" stroke-opacity="0.55"/>
        <g><rect x="190" y="318" width="100" height="34" rx="8" fill="#071C2D" stroke="#38BDF8" stroke-opacity="0.36"/><text x="240" y="339" fill="#BAE6FD">RETRIEVE</text></g>
        <path d="M294 335H304" stroke="#60A5FA" stroke-opacity="0.55"/>
        <g><rect x="308" y="318" width="100" height="34" rx="8" fill="#0B1830" stroke="#60A5FA" stroke-opacity="0.4"/><text x="358" y="339" fill="#BFDBFE">REASON</text></g>
        <path d="M412 335H422" stroke="#818CF8" stroke-opacity="0.55"/>
        <g><rect x="426" y="318" width="100" height="34" rx="8" fill="#11152F" stroke="#818CF8" stroke-opacity="0.4"/><text x="476" y="339" fill="#C7D2FE">ACT</text></g>
        <path d="M530 335H540" stroke="#A78BFA" stroke-opacity="0.55"/>
        <g><rect x="544" y="318" width="100" height="34" rx="8" fill="#17132E" stroke="#A78BFA" stroke-opacity="0.42"/><text x="594" y="339" fill="#DDD6FE">EVALUATE</text></g>
      </g>

      <text x="72" y="378" fill="#7189A6" font-size="12" letter-spacing="1.5">SOURCE // RETRIEVAL // CLAIM // DECISION</text>
    </g>

    <g>
      <circle cx="935" cy="210" r="170" fill="url(#cyanGlow)" opacity="0.42"/>
      <g class="orbit-a">
        <circle cx="935" cy="210" r="137" fill="none" stroke="#67E8F9" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="2 11"/>
        <circle cx="935" cy="73" r="3" fill="#67E8F9" filter="url(#softGlow)"/>
      </g>
      <g class="orbit-b">
        <circle cx="935" cy="210" r="103" fill="none" stroke="#A78BFA" stroke-opacity="0.28" stroke-dasharray="18 8 2 8"/>
        <circle cx="1038" cy="210" r="3" fill="#C4B5FD" filter="url(#softGlow)"/>
      </g>

      <g fill="none" stroke-width="1.4" stroke-dasharray="6 6" class="signal">
        <path d="M935 119V145" stroke="#22D3EE"/>
        <path d="M1000 175L1041 157" stroke="#60A5FA"/>
        <path d="M982 260L1018 309" stroke="#A78BFA"/>
        <path d="M887 256L839 298" stroke="#38BDF8"/>
      </g>

      <circle cx="935" cy="210" r="67" fill="#061526" stroke="url(#edge)" stroke-width="1.5"/>
      <circle cx="935" cy="210" r="54" fill="none" stroke="#67E8F9" stroke-opacity="0.16"/>
      <circle class="pulse" cx="935" cy="210" r="6" fill="#67E8F9" filter="url(#softGlow)"/>
      <text x="935" y="188" class="mono" fill="#7DD3FC" font-size="11" text-anchor="middle" letter-spacing="1.7">EVIDENCE</text>
      <text x="935" y="234" class="sans" fill="#F8FAFC" font-size="22" font-weight="700" text-anchor="middle">SYSTEM</text>
      <text x="935" y="251" class="mono" fill="#8CA3BE" font-size="9" text-anchor="middle" letter-spacing="1.1">TRACEABLE / AUDITABLE</text>

      <g class="mono" text-anchor="middle">
        <g><rect x="867" y="74" width="136" height="34" rx="17" fill="#071C2D" stroke="#22D3EE" stroke-opacity="0.55"/><text x="935" y="95" fill="#A5F3FC" font-size="12" letter-spacing="1">RETRIEVAL</text></g>
        <g><rect x="1036" y="132" width="108" height="34" rx="17" fill="#0B1830" stroke="#60A5FA" stroke-opacity="0.55"/><text x="1090" y="153" fill="#BFDBFE" font-size="12" letter-spacing="1">TOOLS</text></g>
        <g><rect x="1005" y="308" width="112" height="34" rx="17" fill="#17132E" stroke="#A78BFA" stroke-opacity="0.58"/><text x="1061" y="329" fill="#DDD6FE" font-size="12" letter-spacing="1">EVALS</text></g>
        <g><rect x="757" y="292" width="124" height="34" rx="17" fill="#071C2D" stroke="#38BDF8" stroke-opacity="0.55"/><text x="819" y="313" fill="#BAE6FD" font-size="12" letter-spacing="0.8">SOURCE DATA</text></g>
      </g>

      <text x="1132" y="382" class="mono" fill="#7189A6" font-size="11" text-anchor="end" letter-spacing="1">TRACE // TEST // SHIP</text>
    </g>
  </g>

  <rect x="20.75" y="20.75" width="1158.5" height="378.5" rx="23.25" fill="none" stroke="url(#edge)" stroke-opacity="0.48" stroke-width="1.5"/>
</svg>

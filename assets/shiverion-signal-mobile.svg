<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Iqbal Hilmy Izzulhaq — AI systems builder</title>
  <desc id="desc">A mobile dark cyan and violet evidence trace connecting retrieval, tools, source data, and evaluation around an auditable AI system.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#071426"/>
      <stop offset="1" stop-color="#11102B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#67E8F9" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frameClip"><rect x="20" y="20" width="680" height="780" rx="28"/></clipPath>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .signal { animation: signal 6s linear infinite; }
      .orbit-a { transform-origin: 360px 615px; animation: spin 40s linear infinite; }
      .orbit-b { transform-origin: 360px 615px; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .cursor { animation: blink 1.2s steps(2, end) infinite; }
      @keyframes signal { to { stroke-dashoffset: -80; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .signal, .orbit-a, .orbit-b, .pulse, .cursor { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect x="20" y="20" width="680" height="780" rx="28" fill="url(#background)"/>
    <rect x="20" y="20" width="680" height="780" fill="url(#grid)"/>
    <circle cx="104" cy="82" r="260" fill="url(#cyanGlow)"/>
    <circle cx="606" cy="760" r="310" fill="url(#violetGlow)"/>
    <g fill="#CFFAFE" opacity="0.6">
      <circle cx="76" cy="142" r="1.2"/><circle cx="218" cy="57" r="1"/><circle cx="518" cy="92" r="1.1"/>
      <circle cx="656" cy="175" r="1"/><circle cx="94" cy="453" r="1.2"/><circle cx="628" cy="427" r="1"/>
      <circle cx="58" cy="790" r="1.2"/><circle cx="586" cy="768" r="1"/><circle cx="258" cy="786" r="1.1"/>
    </g>

    <g class="mono">
      <rect x="52" y="54" width="278" height="32" rx="16" fill="#0B2238" stroke="#22D3EE" stroke-opacity="0.42"/>
      <circle class="pulse" cx="70" cy="69" r="4" fill="#34D399" filter="url(#softGlow)"/>
      <text x="84" y="74" fill="#A5F3FC" font-size="16" letter-spacing="1.1">SHIVERION // EVIDENCE</text>

      <text x="52" y="158" class="sans" fill="#F8FAFC" font-size="48" font-weight="750" letter-spacing="-1.1">MUHAMMAD IQBAL</text>
      <text x="52" y="212" class="sans" fill="url(#edge)" font-size="48" font-weight="750" letter-spacing="-1.1">HILMY IZZULHAQ</text>
      <text x="54" y="254" fill="#BAE6FD" font-size="24" letter-spacing="1.3">AI AGENT ENGINEER</text>
      <text x="54" y="284" fill="#C4B5FD" font-size="24" letter-spacing="1.3">× DATA SCIENTIST</text>

      <text x="54" y="330" class="sans" fill="#CBD5E1" font-size="30">Building systems that retrieve evidence,</text>
      <text x="54" y="364" class="sans" fill="#CBD5E1" font-size="30">reason with constraints, and survive</text>
      <text x="54" y="398" class="sans" fill="#CBD5E1" font-size="30">contact with real users.<tspan class="cursor" fill="#67E8F9">▋</tspan></text>

      <g font-size="18" text-anchor="middle" letter-spacing="0.5">
        <g><rect x="52" y="424" width="112" height="40" rx="9" fill="#071C2D" stroke="#22D3EE" stroke-opacity="0.4"/><text x="108" y="449" fill="#A5F3FC">OBSERVE</text></g>
        <g><rect x="176" y="424" width="112" height="40" rx="9" fill="#071C2D" stroke="#38BDF8" stroke-opacity="0.4"/><text x="232" y="449" fill="#BAE6FD">RETRIEVE</text></g>
        <g><rect x="300" y="424" width="112" height="40" rx="9" fill="#0B1830" stroke="#60A5FA" stroke-opacity="0.42"/><text x="356" y="449" fill="#BFDBFE">REASON</text></g>
        <g><rect x="424" y="424" width="112" height="40" rx="9" fill="#11152F" stroke="#818CF8" stroke-opacity="0.42"/><text x="480" y="449" fill="#C7D2FE">ACT</text></g>
        <g><rect x="548" y="424" width="120" height="40" rx="9" fill="#17132E" stroke="#A78BFA" stroke-opacity="0.46"/><text x="608" y="449" fill="#DDD6FE">EVALUATE</text></g>
      </g>
    </g>

    <path d="M52 484H668" stroke="#93C5FD" stroke-opacity="0.14"/>

    <g>
      <circle cx="360" cy="615" r="208" fill="url(#cyanGlow)" opacity="0.45"/>
      <g class="orbit-a">
        <circle cx="360" cy="615" r="165" fill="none" stroke="#67E8F9" stroke-opacity="0.32" stroke-width="1.4" stroke-dasharray="2 12"/>
        <circle cx="360" cy="450" r="3.5" fill="#67E8F9" filter="url(#softGlow)"/>
      </g>
      <g class="orbit-b">
        <circle cx="360" cy="615" r="124" fill="none" stroke="#A78BFA" stroke-opacity="0.28" stroke-dasharray="18 8 2 8"/>
        <circle cx="484" cy="615" r="3.5" fill="#C4B5FD" filter="url(#softGlow)"/>
      </g>

      <g fill="none" stroke-width="1.5" stroke-dasharray="6 6" class="signal">
        <path d="M360 500V540" stroke="#22D3EE"/>
        <path d="M435 578L500 550" stroke="#60A5FA"/>
        <path d="M414 690L467 746" stroke="#A78BFA"/>
        <path d="M305 690L250 746" stroke="#38BDF8"/>
      </g>

      <circle cx="360" cy="615" r="80" fill="#061526" stroke="url(#edge)" stroke-width="1.7"/>
      <circle cx="360" cy="615" r="65" fill="none" stroke="#67E8F9" stroke-opacity="0.16"/>
      <circle class="pulse" cx="360" cy="615" r="7" fill="#67E8F9" filter="url(#softGlow)"/>
      <text x="360" y="590" class="mono" fill="#7DD3FC" font-size="20" text-anchor="middle" letter-spacing="1.2">EVIDENCE</text>
      <text x="360" y="641" class="sans" fill="#F8FAFC" font-size="27" font-weight="700" text-anchor="middle">SYSTEM</text>
      <text x="360" y="663" class="mono" fill="#8CA3BE" font-size="16" text-anchor="middle" letter-spacing="0.8">TRACEABLE / AUDITABLE</text>

      <g class="mono" text-anchor="middle">
        <g><rect x="282" y="478" width="156" height="38" rx="19" fill="#071C2D" stroke="#22D3EE" stroke-opacity="0.56"/><text x="360" y="503" fill="#A5F3FC" font-size="18" letter-spacing="0.8">RETRIEVAL</text></g>
        <g><rect x="498" y="526" width="122" height="38" rx="19" fill="#0B1830" stroke="#60A5FA" stroke-opacity="0.56"/><text x="559" y="551" fill="#BFDBFE" font-size="18" letter-spacing="0.8">TOOLS</text></g>
        <g><rect x="464" y="741" width="126" height="38" rx="19" fill="#17132E" stroke="#A78BFA" stroke-opacity="0.58"/><text x="527" y="766" fill="#DDD6FE" font-size="18" letter-spacing="0.8">EVALS</text></g>
        <g><rect x="112" y="741" width="154" height="38" rx="19" fill="#071C2D" stroke="#38BDF8" stroke-opacity="0.56"/><text x="189" y="766" fill="#BAE6FD" font-size="18" letter-spacing="0.6">SOURCE DATA</text></g>
      </g>
    </g>
  </g>

  <rect x="20.75" y="20.75" width="678.5" height="778.5" rx="27.25" fill="none" stroke="url(#edge)" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
